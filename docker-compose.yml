services:
  mypf_be:
    build:
      context: .
      dockerfile: MyPortfolio/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - mypf_db

  mypf_db:
    image: postgres:latest
    environment:
      POSTGRES_USER: franco
      POSTGRES_PASSWORD: tmac90
      POSTGRES_DB: MyPortfolio_DataDocker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      
  mypf_pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - mypf_db
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      

volumes:
  pgdata:
  pgadmin_data:
  