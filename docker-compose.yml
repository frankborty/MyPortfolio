services:
  mypf_be:
    build:
      context: .
      dockerfile: MyPortfolio/Dockerfile
    ports:
      - "8080:8080"
    environment:
     - ConnectionStrings__DataDBConnection=
     - ConnectionStrings__StockPriceWatcherURL=
     - Cors:AllowedOrigins=
 
    mypf_fe:
      build:
        context: ../MyPortfolioFE  # Path dove si trova il Dockerfile del FE
        dockerfile: Dockerfile
      ports:
        - "4200:80"  # 4200 per convenzione FE Angular, esposto da NGINX su 80
      depends_on:
        - mypf_be  # Il FE dipende dal BE
      restart: always  # Riavvia automaticamente in caso di errori
        
  
    mypf_stock-price-watcher:
      build:
        context: ./FinanceStockValue  # Sostituisci con il percorso corretto del tuo progetto Python
        dockerfile: Dockerfile  # Usa il Dockerfile dello script Python
      ports:
        - "50000:50000"  # Espone la porta 50000 per l'API Python (puoi cambiarla se necessario)